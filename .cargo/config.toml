[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# 路径相对仓库根；先运行 scripts/prepare-openssl.ps1 准备固定版本的 x64 静态库。
# 只配置 Windows MSVC 目标，不影响其它平台的 OpenSSL 查找。
[env]
X86_64_PC_WINDOWS_MSVC_OPENSSL_DIR = { value = "target/deps/openssl-3.5.9-windows-x64", relative = true }
X86_64_PC_WINDOWS_MSVC_OPENSSL_LIB_DIR = { value = "target/deps/openssl-3.5.9-windows-x64/lib/static", relative = true }
X86_64_PC_WINDOWS_MSVC_OPENSSL_STATIC = "1"
X86_64_PC_WINDOWS_MSVC_OPENSSL_NO_VENDOR = "1"

# 一键打包安装器：构建 release-perf -> 组装 dist/package -> Inno Setup
# 编译 setup 到 dist/（实现见 src/bin/khaslana_packager.rs）。
[alias]
setup = "run --bin khaslana_packager"

